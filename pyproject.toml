[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant"
version = "0.1.0"
description = "AI customer support assistant: text analysis, tool-calling chat and RAG over help docs, via Groq"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "tenacity",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "fastembed",
    "groq",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in function arguments is the normal FastAPI style.
extend-immutable-calls = ["fastapi.Depends"]
